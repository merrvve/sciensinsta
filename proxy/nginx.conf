# ── HTTP: certbot challenge + redirect all traffic to HTTPS ──────────────────
server {
    listen 80;
    server_name sciensinsta.com www.sciensinsta.com
                bulkinsta.com www.bulkinsta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── sciensinsta.com ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name sciensinsta.com www.sciensinsta.com;

    ssl_certificate     /etc/letsencrypt/live/sciensinsta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sciensinsta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # www → non-www canonical redirect
    if ($host = www.sciensinsta.com) {
        return 301 https://sciensinsta.com$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://sciensinsta-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── bulkinsta.com ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name bulkinsta.com www.bulkinsta.com;

    ssl_certificate     /etc/letsencrypt/live/bulkinsta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bulkinsta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.bulkinsta.com) {
        return 301 https://bulkinsta.com$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://insta-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
