services:

  # ── Single shared reverse proxy ───────────────────────────────────────────
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - web

  # ── Certbot (renewal only — first-run handled by init-letsencrypt.sh) ────
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot renew --webroot --webroot-path /var/www/certbot --quiet"

volumes:
  certbot_www:    # HTTP-01 challenge files shared with nginx
  letsencrypt:    # certificates shared with nginx

networks:
  web:
    external: true   # created once with: docker network create web
