services:

  # ── Redis (message broker + result backend) ───────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80"
      REDIS_URL: "redis://redis:6379/0"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - user_docs:/app/userDocs             # shared with celery-worker so downloads work
      - ./backend/subscribers:/app/subscribers  # newsletter subscriber list
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      REDIS_URL: "redis://redis:6379/0"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - user_docs:/app/userDocs   # shared with backend so downloads work
    depends_on:
      redis:
        condition: service_healthy

  # ── Astro frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  user_docs:   # xlsx files written by celery-worker, served by backend
