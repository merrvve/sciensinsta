services:

  # ── Redis (message broker + result backend) ───────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ALLOWED_ORIGINS: "https://sciensinsta.com,https://www.sciensinsta.com"
      REDIS_URL: "redis://redis:6379/0"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - user_docs:/app/userDocs
      - ./backend/subscribers:/app/subscribers
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      REDIS_URL: "redis://redis:6379/0"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - user_docs:/app/userDocs
    depends_on:
      redis:
        condition: service_healthy

  # ── Astro frontend (nginx, internal only) ────────────────────────────────────
  # Does NOT bind host ports — the shared nginx-proxy container routes to it
  # via the external "web" network using the container_name below.
  frontend:
    container_name: sciensinsta-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - default
      - web
    depends_on:
      backend:
        condition: service_healthy

volumes:
  user_docs:

networks:
  web:
    external: true   # shared with other apps; create with: docker network create web
